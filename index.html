<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emulador Web</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
      position: fixed;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }
    #start-screen {
      color: #fff;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .start-banner {
      max-width: 280px;
      max-height: 200px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .btn-start {
      background-color: #e50914;
      color: white;
      padding: 16px 32px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
  </style>
</head>
<body>

  <!-- Tela Inicial -->
  <div id="start-screen">
    <img id="game-cover" src="" alt="Capa do Jogo" class="start-banner">
    <button class="btn-start">INICIAR JOGO</button>
  </div>

  <div id="game-container">
    <div id="game" style="width:100%; height:100%;"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');
    const consoleType = urlParams.get('console') || 'snes';

    const extensions = {
      'snes': 'smc',
      'segaMD': 'md',
      'gba': 'gba',
      'gbc': 'gbc',
      'n64': 'z64'
    };

    if (gameId) {
      // 1. Capa dinâmica
      const coverImg = document.getElementById('game-cover');
      coverImg.src = `roms/${gameId}.png`;

      coverImg.onerror = () => {
        coverImg.style.display = 'none';
      };

      // 2. Limpa a URL
      window.history.replaceState({}, document.title, window.location.pathname + "play");

      const startScreen = document.getElementById('start-screen');
      const gameContainer = document.getElementById('game-container');

      async function handleOrientation(consoleType) {
        // Desativado a chamada de fullscreen automatico para o modo retrato
        // assim o layout CSS do navegador nao e sobrescrito pela API do celular
        if (consoleType !== 'gba' && consoleType !== 'gbc') {
          const docEl = document.documentElement;
          if (docEl.requestFullscreen) {
            try { await docEl.requestFullscreen(); } catch (e) {}
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
          }
        }

        if (screen.orientation && screen.orientation.lock) {
          try {
            if (consoleType === 'gba' || consoleType === 'gbc') {
              await screen.orientation.lock('portrait');
            } else {
              await screen.orientation.lock('landscape');
            }
          } catch (e) {}
        }
      }

      startScreen.addEventListener('click', async () => {
        await handleOrientation(consoleType);
        
        startScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        const ext = extensions[consoleType] || 'smc';

        EJS_player = '#game';
        EJS_core = consoleType;
        EJS_gameUrl = `roms/${gameId}.${ext}`;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        EJS_onReady = () => {
          const forceReposition = setInterval(() => {
            // Reposiciona botão inicial
            const targets = document.querySelectorAll('.ejs_start_button, #game button, div[class*="start"], div[class*="dialog"]');
            
            targets.forEach(el => {
              if (el) {
                el.style.setProperty('position', 'absolute', 'important');
                el.style.setProperty('top', '35%', 'important');
                el.style.setProperty('bottom', 'auto', 'important');
                el.style.setProperty('left', '50%', 'important');
                el.style.setProperty('transform', 'translateX(-50%)', 'important');
                el.style.setProperty('z-index', '2147483647', 'important');
                el.style.setProperty('margin', '0 auto', 'important');

                if (typeof el.click === 'function') {
                  el.click();
                }
              }
            });

            // Injeta o deslocamento da tela do jogo no modo retrato
            if (consoleType === 'gba' || consoleType === 'gbc') {
              const elements = document.querySelectorAll('#game, #game > div, #game canvas, #game iframe');
              elements.forEach(el => {
                if (el.tagName.toLowerCase() === 'canvas' || el.tagName.toLowerCase() === 'iframe') {
                  el.style.setProperty('margin-top', '150px', 'important');
                  el.style.setProperty('position', 'relative', 'important');
                  el.style.setProperty('top', '0', 'important');
                }
              });
            }

          }, 50);

          setTimeout(() => clearInterval(forceReposition), 10000);
        };

        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(script);
      });

    } else {
      document.getElementById('start-screen').innerHTML = 
        '<h2 style="color: white;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>

</body>
</html>
