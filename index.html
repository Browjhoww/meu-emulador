<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emulador Web</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
    }
    .start-banner {
      max-width: 280px;
      max-height: 200px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .btn-start {
      background-color: #e50914;
      color: white;
      padding: 16px 32px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <!-- Sua Tela Inicial Customizada -->
  <div id="start-screen">
    <img id="game-cover" src="" alt="Capa do Jogo" class="start-banner">
    <button class="btn-start" id="btn-play">INICIAR JOGO</button>
  </div>

  <div id="game-container">
    <div id="game" style="width:100%; height:100%;"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');
    const consoleType = urlParams.get('console') || 'snes';

    const extensions = {
      'snes': 'smc',
      'segaMD': 'md',
      'gba': 'gba',
      'gbc': 'gbc',
      'n64': 'z64'
    };

    if (gameId) {
      // 1. Define a capa e trata o fallback caso não exista imagem
      const coverImg = document.getElementById('game-cover');
      coverImg.src = `roms/${gameId}.png`;
      coverImg.onerror = () => { coverImg.style.display = 'none'; };

      // 2. Limpa a URL para deixar o endereço amigável
      window.history.replaceState({}, document.title, window.location.pathname + "play");

      const ext = extensions[consoleType] || 'smc';

      // Configurações do EmulatorJS
      EJS_player = '#game';
      EJS_core = consoleType;
      EJS_gameUrl = `roms/${gameId}.${ext}`;
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      EJS_startOnLoaded = true; // Ignora a tela interna azul do emulador

      // Injeta o script em segundo plano
      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);

      // Ação ao clicar na sua tela/botão vermelho
      document.getElementById('start-screen').addEventListener('click', async () => {
        // Bloqueio de orientação do dispositivo
        if (screen.orientation && screen.orientation.lock) {
          try {
            if (consoleType === 'gba' || consoleType === 'gbc') {
              await screen.orientation.lock('portrait');
            } else {
              await screen.orientation.lock('landscape');
            }
          } catch(e) {}
        }

        // Esconde a sua tela e exibe o jogo
        document.getElementById('start-screen').style.display = 'none';

        // Mantém o ajuste de margem para afastar a tela da câmera no modo retrato
        if (consoleType === 'gba' || consoleType === 'gbc') {
          const checkCanvas = setInterval(() => {
            const canvas = document.querySelector('#game canvas');
            if (canvas) {
              canvas.style.setProperty('margin-top', '150px', 'important');
              canvas.style.setProperty('position', 'relative', 'important');
              clearInterval(checkCanvas);
            }
          }, 50);
        }
      });

    } else {
      document.getElementById('start-screen').innerHTML = 
        '<h2 style="color:white;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>

</body>
</html>
