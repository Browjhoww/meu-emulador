<script>
    const urlParams = new URLSearchParams(window.location.search);
    // Remove extensoes caso o usuario tenha digitado na URL por engano
    let rawGameParam = urlParams.get('game') || '';
    const gameId = rawGameParam.replace(/\.(smc|sfc|gba|gbc|md|z64)$/i, '');
    const consoleType = urlParams.get('console') || 'snes';

    const extensions = {
      'snes': 'sfc', // Se as suas ROMs de SNES são .sfc, mantemos sfc aqui
      'segaMD': 'md',
      'gba': 'gba',
      'gbc': 'gbc',
      'n64': 'z64'
    };

    if (gameId) {
      const coverImg = document.getElementById('game-cover');
      coverImg.src = `roms/${gameId}.png`;
      coverImg.onerror = () => { coverImg.style.display = 'none'; };

      window.history.replaceState({}, document.title, window.location.pathname + "play");

      const ext = extensions[consoleType] || 'sfc';

      // Configurações do EmulatorJS
      EJS_player = '#game';
      EJS_core = consoleType;
      // Tenta carregar a ROM
      EJS_gameUrl = `roms/${gameId}.${ext}`;
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      EJS_allowFullscreen = true;

      // Injeta o script do emulador
      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);

      // Ação ao clicar no botão vermelho
      document.getElementById('start-screen').addEventListener('click', async () => {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen().catch(() => {});
        }

        if (screen.orientation && screen.orientation.lock) {
          try {
            if (consoleType === 'gba' || consoleType === 'gbc') {
              await screen.orientation.lock('portrait');
            } else {
              await screen.orientation.lock('landscape');
            }
          } catch(e) {}
        }

        document.getElementById('start-screen').style.display = 'none';

        if (consoleType === 'gba' || consoleType === 'gbc') {
          const checkCanvas = setInterval(() => {
            const canvas = document.querySelector('#game canvas');
            if (canvas) {
              canvas.style.setProperty('margin-top', '150px', 'important');
              canvas.style.setProperty('position', 'relative', 'important');
              clearInterval(checkCanvas);
            }
          }, 50);
        }
      });

    } else {
      document.getElementById('start-screen').innerHTML = 
        '<h2 style="color:white;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>
