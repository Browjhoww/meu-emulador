<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emulador SNES</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // Lê o nome do jogo na URL (ex: ?game=mario)
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');

    if (gameId) {
      EJS_player = '#game';
      EJS_core = 'snes'; // Core de Super Nintendo
      EJS_gameUrl = `roms/${gameId}.smc`; // Busca a ROM dentro da pasta "roms"
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    } else {
      document.getElementById('game-container').innerHTML = 
        '<h2 style="color: white; text-align: center; margin-top: 20%; font-family: sans-serif;">Nenhum jogo especificado no link.</h2>';
    }
  </script>

</body>
</html>
