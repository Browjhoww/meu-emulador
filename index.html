<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Emulador Web</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
    }
    .start-banner {
      max-width: 280px;
      max-height: 200px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .btn-start {
      background-color: #e50914;
      color: white;
      padding: 16px 32px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <!-- Tela Inicial Customizada -->
  <div id="start-screen">
    <img id="game-cover" src="" alt="Capa do Jogo" class="start-banner">
    <button class="btn-start" id="btn-play">INICIAR JOGO</button>
  </div>

  <div id="game-container">
    <div id="game" style="width:100%; height:100%;"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let rawGameParam = urlParams.get('game') || '';
    const consoleType = urlParams.get('console') || 'snes';

    if (rawGameParam) {
      let gameName = rawGameParam;
      let explicitExt = null;

      // Se o usuário digitou a extensão na URL (ex: Aladdin.sfc)
      if (rawGameParam.includes('.')) {
        const parts = rawGameParam.split('.');
        explicitExt = parts.pop();
        gameName = parts.join('.');
      }

      // Capa do jogo (ex: roms/Aladdin.png)
      const coverImg = document.getElementById('game-cover');
      coverImg.src = `roms/${gameName}.png`;
      coverImg.onerror = () => { coverImg.style.display = 'none'; };

      // Limpa a URL no navegador
      window.history.replaceState({}, document.title, window.location.pathname + "play");

      // Função para validar se o arquivo existe na pasta antes de passar para o emulador
      async function resolveRomUrl(name, console, explicit) {
        if (explicit) return `roms/${name}.${explicit}`;

        const extensionsMap = {
          'snes': ['smc', 'sfc'],
          'segaMD': ['md'],
          'gba': ['gba'],
          'gbc': ['gbc'],
          'n64': ['z64']
        };

        const candidates = extensionsMap[console] || ['smc', 'sfc'];

        for (const ext of candidates) {
          const testUrl = `roms/${name}.${ext}`;
          try {
            const res = await fetch(testUrl, { method: 'HEAD' });
            if (res.ok) {
              return testUrl;
            }
          } catch (e) {
            // Se falhar o teste HEAD, tenta o próximo candidato
          }
        }

        // Fallback para a primeira opção se nenhum teste responder
        return `roms/${name}.${candidates[0]}`;
      }

      // Inicialização assíncrona
      (async () => {
        const romUrl = await resolveRomUrl(gameName, consoleType, explicitExt);

        // Configurações do EmulatorJS
        window.EJS_player = '#game';
        window.EJS_core = consoleType;
        window.EJS_gameName = gameName;
        window.EJS_gameUrl = romUrl;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_allowFullscreen = true;

        // Injeta o script do EmulatorJS
        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(script);
      })();

      // Ação do clique no botão vermelho
      document.getElementById('start-screen').addEventListener('click', async () => {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen().catch(() => {});
        }

        if (screen.orientation && screen.orientation.lock) {
          try {
            if (consoleType === 'gba' || consoleType === 'gbc') {
              await screen.orientation.lock('portrait');
            } else {
              await screen.orientation.lock('landscape');
            }
          } catch(e) {}
        }

        document.getElementById('start-screen').style.display = 'none';
      });

    } else {
      document.getElementById('start-screen').innerHTML = 
        '<h2 style="color:white;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>

</body>
</html>
