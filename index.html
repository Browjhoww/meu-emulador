<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emulador Web</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
      position: fixed;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }
    #start-screen {
      color: #fff;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .start-banner {
      max-width: 280px;
      max-height: 200px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    .btn-start {
      background-color: #e50914;
      color: white;
      padding: 16px 32px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
  </style>
</head>
<body>

  <!-- Tela Inicial -->
  <div id="start-screen">
    <!-- A imagem será carregada via JavaScript dinamicamente -->
    <img id="game-cover" src="" alt="Capa do Jogo" class="start-banner">
    <button class="btn-start">INICIAR JOGO</button>
  </div>

  <div id="game-container">
    <div id="game" style="width:100%; height:100%;"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');
    const consoleType = urlParams.get('console') || 'snes';

    const extensions = {
      'snes': 'smc',
      'segaMD': 'md',
      'gba': 'gba',
      'gbc': 'gbc',
      'n64': 'z64'
    };

    if (gameId) {
      // 1. Define a capa automaticamente com o nome da ROM (ex: roms/mario.png, roms/sonic.png)
      const coverImg = document.getElementById('game-cover');
      coverImg.src = `roms/${gameId}.png`;

      // Caso a imagem falhe ao carregar (não exista), oculta a tag para não quebrar a tela
      coverImg.onerror = () => {
        coverImg.style.display = 'none';
      };

      // 2. Mascara a URL removendo os parâmetros
      window.history.replaceState({}, document.title, window.location.pathname + "play");

      const startScreen = document.getElementById('start-screen');
      const gameContainer = document.getElementById('game-container');

      async function forceFullscreenAndLandscape() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          try { await docEl.requestFullscreen(); } catch (e) {}
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          try { await screen.orientation.lock('landscape'); } catch (e) {}
        }
      }

      startScreen.addEventListener('click', async () => {
        await forceFullscreenAndLandscape();
        
        startScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        const ext = extensions[consoleType] || 'smc';

        EJS_player = '#game';
        EJS_core = consoleType;
        EJS_gameUrl = `roms/${gameId}.${ext}`;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // Auto-clique no botão interno
        EJS_onReady = () => {
          const autoClicker = setInterval(() => {
            const startBtn = document.querySelector('#game button') || document.querySelector('.ejs_start_button');
            if (startBtn) {
              startBtn.click();
              clearInterval(autoClicker);
            }
          }, 100);
        };

        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(script);
      });

    } else {
      document.getElementById('start-screen').innerHTML = 
        '<h2 style="color: white;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>

</body>
</html>
