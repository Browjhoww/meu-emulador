<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emulador Web</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
      position: fixed;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }
    #start-screen {
      color: #fff;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      padding: 20px;
      width: 100%;
    }
    .btn-start {
      background-color: #e50914;
      color: white;
      padding: 16px 32px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
  </style>
</head>
<body>

  <!-- Tela Inicial -->
  <div id="start-screen">
    <h2>🎮 Clique para Iniciar o Jogo</h2>
    <button class="btn-start">INICIAR JOGO</button>
  </div>

  <!-- Emulador em Tela Cheia Fixa -->
  <div id="game-container">
    <div id="game" style="width:100%; height:100%;"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');
    const consoleType = urlParams.get('console') || 'snes';

    const extensions = {
      'snes': 'smc',
      'segaMD': 'md',
      'gba': 'gba',
      'gbc': 'gbc',
      'n64': 'z64'
    };

    if (gameId) {
      // --- MÁSCARA DE URL ---
      // Apaga o ?game=... e ?console=... da barra do navegador assim que lê o jogo
      window.history.replaceState({}, document.title, window.location.pathname + "play");

      const startScreen = document.getElementById('start-screen');
      const gameContainer = document.getElementById('game-container');

      async function forceFullscreenAndLandscape() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          try { await docEl.requestFullscreen(); } catch (e) {}
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          try { await screen.orientation.lock('landscape'); } catch (e) {}
        }
      }

      startScreen.addEventListener('click', async () => {
        await forceFullscreenAndLandscape();
        
        startScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        const ext = extensions[consoleType] || 'smc';

        // Configuração do Emulador
        EJS_player = '#game';
        EJS_core = consoleType;
        EJS_gameUrl = `roms/${gameId}.${ext}`;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(script);
      });

    } else {
      document.getElementById('start-screen').innerHTML = 
        '<h2 style="color: white;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>

</body>
</html>
