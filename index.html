<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover garante que o jogo ocupe até a área da câmera do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emulador SNES</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
      position: fixed; /* Evita rolagem no celular */
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
    }
    #start-screen {
      color: #fff;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      padding: 20px;
      width: 100%;
    }
    .btn-start {
      background-color: #e50914;
      color: white;
      padding: 16px 32px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
  </style>
</head>
<body>

  <!-- Tela Inicial -->
  <div id="start-screen">
    <h2>🎮 Clique para Iniciar em Tela Cheia</h2>
    <button class="btn-start">INICIAR JOGO</button>
  </div>

  <!-- Emulador -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');

    if (gameId) {
      const startScreen = document.getElementById('start-screen');
      const gameContainer = document.getElementById('game-container');

      // Função para forçar tela cheia em celulares (Android e iOS)
      function enableMobileFullscreen() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { /* Chrome Android / Safari iOS */
          docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) {
          docEl.msRequestFullscreen();
        }
      }

      startScreen.addEventListener('click', () => {
        enableMobileFullscreen();
        
        startScreen.style.display = 'none';
        gameContainer.style.display = 'block';

        // Configuração do Emulador
        EJS_player = '#game';
        EJS_core = 'snes';
        EJS_gameUrl = `roms/${gameId}.smc`;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        document.body.appendChild(script);
      });

    } else {
      document.getElementById('start-screen').innerHTML = 
        '<h2 style="color: white;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>

</body>
</html>
