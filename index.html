<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emulador SNES</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');

    if (gameId) {
      EJS_player = '#game';
      EJS_core = 'snes';
      
      // Aceita tanto arquivos .smc padrão quanto arquivos com extensão no link (ex: jogo.sfc)
      EJS_gameUrl = gameId.includes('.') ? `roms/${gameId}` : `roms/${gameId}.smc`;
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    } else {
      document.getElementById('game-container').innerHTML = 
        '<h2 style="color: white; text-align: center;">Nenhum jogo especificado na URL.</h2>';
    }
  </script>

</body>
</html>
